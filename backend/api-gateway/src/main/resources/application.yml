server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
          - name: RequestRateLimiter
            args:
              redis-rate-limiter.replenishRate: 10
              redis-rate-limiter.burstCapacity: 20
              key-resolver: "#{@ipKeyResolver}"
          routes:

            # Authentication - handled by Modular Monolith
            - id: auth-service
              uri: http://localhost:8091
              predicates:
                - Path=/api/auth/**

            # Customer Service
            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/customers/**,/api/v1/customers/**

            # Product Service
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

            # Order Service
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**

            # Inventory Service
            - id: inventory-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/inventory/**

            # Payment Service
            - id: payment-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/payments/**

            # Invoice Service
            - id: invoice-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/invoices/**

            # Notification Service
            - id: notification-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/notifications/**

  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
  endpoint:
    gateway:
      access: read-only