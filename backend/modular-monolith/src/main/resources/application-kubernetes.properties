spring.application.name=modular-monolith
server.port=8091

# MySQL
spring.datasource.url=jdbc:mysql://host.docker.internal:3307/ecommerce
spring.datasource.username=root
spring.datasource.password=EcommerceDev@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# Kafka
spring.kafka.bootstrap-servers=host.docker.internal:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.monolith.kafka.event.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.monolith.kafka.event

# Redis
spring.data.redis.host=host.docker.internal
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing ecommerce schema

# ==================================
# RESILIENCE4J - PAYMENT GATEWAY
# ==================================

# Circuit Breaker
resilience4j.circuitbreaker.instances.paymentGateway.register-health-indicator=true
resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentGateway.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentGateway.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentGateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentGateway.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentGateway.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.paymentGateway.automatic-transition-from-open-to-half-open-enabled=true

# Retry
resilience4j.retry.instances.paymentGateway.max-attempts=3
resilience4j.retry.instances.paymentGateway.wait-duration=1s
resilience4j.retry.instances.paymentGateway.enable-exponential-backoff=true
resilience4j.retry.instances.paymentGateway.exponential-backoff-multiplier=2