spring.application.name=invoice-service
server.port=8086

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/ecommerce_invoice
spring.datasource.username=root
spring.datasource.password=EcommerceDev@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=invoice-service
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.invoice.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.ecommerce.invoice.event.OrderConfirmedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true