
services:
  api-gateway:
    image: ecommerce-gateway:1.0
    container_name: ecommerce-gateway
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: api-gateway
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - customer-service
      - product-service
      - order-service
      - inventory-service
      - payment-service
      - invoice-service
      - notification-service
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.4.0
    container_name: ecommerce-kafka
    ports:
      - "9092:9092"
      - "39092:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:29092,K8S://:39092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092,K8S://host.docker.internal:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,K8S:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: ecommerce-mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  ecommerce-app:
    image: ecommerce-monolith:1.0
    container_name: ecommerce-monolith
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/ecommerce
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  customer-service:
    image: ecommerce-customer:1.0
    container_name: ecommerce-customer
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: customer-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/customer_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  product-service:
    image: ecommerce-product:1.0
    container_name: ecommerce-product
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: product-service
    ports:
      - "8082:8082"
    environment:
        SPRING_DATA_MONGODB_URI: mongodb://admin:${MONGO_PASSWORD_URLENCODED}@mongodb:27017/ecommerce?authSource=admin
    depends_on:
      - mongodb
    restart: unless-stopped

  order-service:
    image: ecommerce-order:1.1
    container_name: ecommerce-order
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/ecommerce
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SERVICES_PRODUCT_URL: http://product-service:8082
      SERVICES_INVENTORY_URL: http://inventory-service:8084
      SERVICES_PAYMENT_URL: http://payment-service:8085

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      - kafka
      - product-service
      - inventory-service
      - payment-service
    restart: unless-stopped

  inventory-service:
    image: ecommerce-inventory:1.0
    container_name: ecommerce-inventory
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: inventory-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/ecommerce
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  payment-service:
    image: ecommerce-payment:1.1
    container_name: ecommerce-payment
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/ecommerce_payment
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  invoice-service:
    image: ecommerce-invoice:1.1
    container_name: ecommerce-invoice
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: invoice-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/ecommerce_invoice
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: invoice-service
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest

    depends_on:
      - kafka
    restart: unless-stopped

  notification-service:
    image: ecommerce-notification:1.1
    container_name: ecommerce-notification
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        SERVICE: notification-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/ecommerce_notification
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-service
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest

    depends_on:
      - kafka
    restart: unless-stopped

volumes:
    mongodb_data: