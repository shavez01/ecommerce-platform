apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: invoice-service

  template:
    metadata:
      labels:
        app: invoice-service

    spec:
      containers:
        - name: invoice-service
          image: ecommerce-invoice:1.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8086

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://host.docker.internal:3307/ecommerce_invoice"

            - name: SPRING_DATASOURCE_USERNAME
              value: root

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: DB_PASSWORD

            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"

            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "host.docker.internal:39092"

            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "invoice-service"

            - name: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
              value: "earliest"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 40
            periodSeconds: 20